{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto space-y-8 pb-20 pt-4 text-center">
    
    <!-- Header -->
    <div class="space-y-2">
        <div class="inline-flex items-center gap-2 bg-amber-500/10 border border-amber-500/30 px-4 py-1.5 rounded-full text-amber-400 text-xs font-black uppercase tracking-widest shadow-inner">
            <span>🍻</span> Scuffed Party Mode <span>🍻</span>
        </div>
        <h1 class="text-3xl sm:text-4xl font-black uppercase tracking-tight text-white">The Judgement Wheel</h1>
        <p class="text-xs sm:text-sm text-indigo-300">Spin the slots, face your dare, or take the drink penalty!</p>
    </div>

    <!-- Category Filter Tabs -->
    <div class="flex flex-wrap items-center justify-center gap-2">
        <button onclick="setCategory('all')" id="cat-all" class="cat-btn bg-amber-500 text-slate-950 px-4 py-2 rounded-xl font-black text-xs uppercase tracking-wider transition shadow-lg">All</button>
        <button onclick="setCategory('standard')" id="cat-standard" class="cat-btn bg-indigo-950/80 border border-indigo-800 text-slate-300 hover:text-white px-4 py-2 rounded-xl font-black text-xs uppercase tracking-wider transition shadow">Standard</button>
        <button onclick="setCategory('timed')" id="cat-timed" class="cat-btn bg-indigo-950/80 border border-indigo-800 text-slate-300 hover:text-white px-4 py-2 rounded-xl font-black text-xs uppercase tracking-wider transition shadow">Timed</button>
        <button onclick="setCategory('duel')" id="cat-duel" class="cat-btn bg-indigo-950/80 border border-indigo-800 text-slate-300 hover:text-white px-4 py-2 rounded-xl font-black text-xs uppercase tracking-wider transition shadow">Duel</button>
        <button onclick="setCategory('spicy')" id="cat-spicy" class="cat-btn bg-indigo-950/80 border border-indigo-800 text-slate-300 hover:text-white px-4 py-2 rounded-xl font-black text-xs uppercase tracking-wider transition shadow">Spicy</button>
    </div>

    <!-- Main Game Card Container -->
    <div class="bg-gradient-to-br from-indigo-950/90 via-purple-950/90 to-slate-950/90 border border-amber-500/30 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6 relative overflow-hidden backdrop-blur-md">
        
        <!-- Target / Nation Display Box -->
        <div class="bg-indigo-950/60 border border-indigo-800/80 rounded-2xl p-4 shadow-inner">
            <span id="targetLabel" class="text-[10px] font-mono uppercase tracking-widest text-indigo-400 block mb-1">Selected Target</span>
            <div id="slotNation" class="text-xl sm:text-2xl font-black text-white uppercase tracking-wider flex items-center justify-center gap-2">
                <span>🎰</span> Hit Spin to Roll!
            </div>
        </div>

        <!-- Task Prompt Box -->
        <div class="bg-slate-950/70 border border-indigo-800/60 rounded-2xl p-6 shadow-inner min-h-[120px] flex items-center justify-center">
            <div id="slotTask" class="text-base sm:text-lg font-bold text-slate-100 leading-relaxed max-w-lg">
                Your chaotic prompt or dare will appear here...
            </div>
        </div>
    </div>

    <!-- Spin Button Action -->
    <div>
        <button id="spinBtn" onclick="spinSlots()" disabled class="bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-500 opacity-50 cursor-not-allowed text-slate-950 font-black text-sm sm:text-base uppercase tracking-widest py-4 px-12 rounded-2xl transition shadow-xl shadow-amber-500/20">
            🎰 Loading Tasks...
        </button>
    </div>

</div>

<script>
    const teams = [
        {% for t in teams %}
        { name: "{{ t.nation_name }}", participant: "{{ t.participant_name }}", flag: "{{ t.flag_emoji }}" },
        {% endfor %}
    ];

    let tasks = [];
    let currentCategory = 'all';

    fetch('/api/party-tasks')
        .then(res => res.json())
        .then(data => {
            tasks = data;
            document.getElementById("slotNation").innerHTML = `<span>🎰</span> Ready to Spin!`;
            document.getElementById("slotTask").innerText = `Press the button below to draw your first prompt.`;
            const spinBtn = document.getElementById("spinBtn");
            spinBtn.disabled = false;
            spinBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            spinBtn.innerText = `🎰 Spin the Slots! →`;
        })
        .catch(err => {
            document.getElementById("slotTask").innerText = "Error loading tasks from database.";
        });

    function setCategory(cat) {
        currentCategory = cat;
        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.classList.remove('bg-amber-500', 'text-slate-950', 'border-amber-400');
            btn.classList.add('bg-indigo-950/80', 'border-indigo-800', 'text-slate-300');
        });
        const activeBtn = document.getElementById(`cat-${cat}`);
        activeBtn.classList.remove('bg-indigo-950/80', 'border-indigo-800', 'text-slate-300');
        activeBtn.classList.add('bg-amber-500', 'text-slate-950', 'shadow-lg');
    }

    function getRandomItem(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    function spinSlots() {
        const filteredTasks = currentCategory === 'all' 
            ? tasks 
            : tasks.filter(t => t.category && t.category.toLowerCase() === currentCategory.toLowerCase());

        if (teams.length === 0 || tasks.length === 0) {
            alert("Missing teams or tasks database entries!");
            return;
        }

        if (filteredTasks.length === 0) {
            alert(`No tasks found for category: ${currentCategory}`);
            return;
        }

        const btn = document.getElementById("spinBtn");
        btn.disabled = true;

        let counter = 0;
        const maxClicks = 15;
        const rollSpeed = 60;

        const rollInterval = setInterval(() => {
            const tempTeam1 = getRandomItem(teams);
            document.getElementById("slotNation").innerHTML = `<span>${tempTeam1.flag}</span> ${tempTeam1.name}`;
            document.getElementById("slotTask").innerText = getRandomItem(filteredTasks).task;

            counter++;
            if (counter >= maxClicks) {
                clearInterval(rollInterval);
                finalizeSelection(filteredTasks);
                btn.disabled = false;
            }
        }, rollSpeed);
    }

    function finalizeSelection(filteredTasks) {
        const selectedTask = getRandomItem(filteredTasks);
        const minS = selectedTask.min_sips || 1;
        const maxS = selectedTask.max_sips || 4;
        const randomSips = Math.floor(Math.random() * (maxS - minS + 1)) + minS;
        const randomSeconds = (Math.floor(Math.random() * 3) + 1) * 15;

        const team1 = getRandomItem(teams);
        
        let taskText = selectedTask.task || "";
        let formattedTask = taskText
            .replace(/{sips}/g, `<span class="inline-flex items-center justify-center px-2.5 py-0.5 mx-1 bg-amber-500 text-slate-950 font-black rounded-md text-sm shadow">${randomSips}</span>`)
            .replace(/{seconds}/g, `<span class="inline-flex items-center justify-center px-2.5 py-0.5 mx-1 bg-amber-500 text-slate-950 font-black rounded-md text-sm shadow">${randomSeconds}</span>`);

        const cat = (selectedTask.category || "").toLowerCase();
        let nationHtml = "";

        // STRICT CHECK: ONLY trigger VS mode if category is genuinely 'duel'
        if (cat === 'duel') {
            let team2 = getRandomItem(teams);
            while (team2.name === team1.name && teams.length > 1) {
                team2 = getRandomItem(teams);
            }
            document.getElementById("targetLabel").innerText = "Selected Matchup";
            nationHtml = `<span class="flex items-center gap-1.5"><span>${team1.flag}</span> ${team1.name}</span> <span class="text-amber-400 font-black text-lg px-2">VS</span> <span class="flex items-center gap-1.5"><span>${team2.flag}</span> ${team2.name}</span>`;
            
            // Clean up any stray placeholders if present
            formattedTask = formattedTask.replace(/\{\{nation1\}\}/g, team1.name).replace(/\{\{nation2\}\}/g, team2.name);
        } else {
            document.getElementById("targetLabel").innerText = "Selected Target";
            nationHtml = `<span>${team1.flag}</span> ${team1.name} <span class="text-xs text-indigo-300 font-normal ml-1">(${team1.participant})</span>`;
        }

        document.getElementById("slotNation").innerHTML = nationHtml;
        document.getElementById("slotTask").innerHTML = formattedTask;
    }
</script>
{% endblock %}
